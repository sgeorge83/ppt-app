name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bundle Bible text and Urdu font
        run: |
          python packaging/prepare_data.py
          python packaging/fetch_font.py

      - name: Test verse wording and PowerPoint slides
        run: python -m pytest

      - name: Generate Store assets and About image
        run: |
          python packaging/generate_assets.py
          python -m slides.about_card
          python app.py --about-snapshot store/listing/en-US/about.png

      - name: Build the app
        run: pyinstaller --noconfirm --clean wordonair-slides.spec

      - name: Stage MSIX payload
        shell: pwsh
        run: |
          $payload = "dist/WordOnAirSlides"
          Copy-Item packaging/AppxManifest.xml "$payload/AppxManifest.xml" -Force
          New-Item -ItemType Directory -Force -Path "$payload/Assets","$payload/Fonts","$payload/data" | Out-Null
          Copy-Item packaging/Assets/* "$payload/Assets/" -Force
          Copy-Item packaging/Fonts/* "$payload/Fonts/" -Force
          Copy-Item data/english "$payload/data/english" -Recurse -Force
          Copy-Item data/urdu "$payload/data/urdu" -Recurse -Force
          if (-not (Test-Path "$payload/data/english/books.json")) { throw "English Bible missing from payload" }
          if (-not (Test-Path "$payload/data/urdu/books.json")) { throw "Urdu Bible missing from payload" }
          if (-not (Test-Path "$payload/Fonts/NotoNastaliqUrdu-Regular.ttf")) { throw "Urdu font missing from payload" }

      - name: Pack MSIX if Windows SDK is present
        shell: pwsh
        run: |
          $make = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $make) {
            Write-Host "makeappx.exe not found; uploading payload folder only"
            exit 0
          }
          & $make.FullName pack /d dist\WordOnAirSlides /p dist\WordOnAirSlides_1.0.1.0_x64.msix /o

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordOnAirSlides-windows
          path: |
            dist/WordOnAirSlides
            dist/*.msix
            store/listing/en-US/about.png
          if-no-files-found: error
