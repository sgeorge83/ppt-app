name: Chrome Web Store

on:
  push:
    branches: [chrome-web-store, main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: chrome-web-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the extension build tools
        run: |
          python -m pip install --upgrade pip
          pip install pillow python-pptx pytest lxml

      - name: Test the extension engine
        run: python -m pytest chrome/test_package.py

      - name: Build the Chrome Web Store zip
        run: python packaging/build_chrome.py

      - name: Check John 3:16 in the packaged Bible
        run: node chrome/engine/check.mjs dist/chrome/data/bible.json

      - name: Upload the Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: WordOnAirSlides-chrome
          path: dist/*_chrome.zip
          if-no-files-found: error
